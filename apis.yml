aid: tendermint
name: Tendermint
description: >-
  Tendermint is a core contributor to the Cosmos Network and the original
  developer of Tendermint Core, a best-in-class Byzantine Fault Tolerant (BFT)
  consensus engine for state-machine replication, alongside the Cosmos SDK
  blockchain application framework and the IBC inter-blockchain communication
  protocol. Its primary developer-facing API is the Tendermint RPC — a JSONRPC
  2.0 interface (also exposed as a REST-URI form and over websockets) for
  querying chain state, blocks, transactions and validators, and broadcasting
  transactions to a node. Tendermint Core has since been renamed to CometBFT,
  which is the actively maintained successor.
